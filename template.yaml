AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  Annkut backend - Node.js on AWS Lambda behind an API Gateway HTTP API,
  talking to RDS MySQL. Port of the CodeIgniter 3 application.

Parameters:
  Stage:
    Type: String
    Default: prod
    AllowedValues: [dev, prod]
    Description: Deployment stage name.

  DbHost:
    Type: String
    Description: >
      RDS endpoint, or the RDS Proxy endpoint if you provisioned one
      (recommended - see docs/DEPLOY.md).

  DbPort:
    Type: String
    Default: '3306'

  DbName:
    Type: String
    Description: Schema name, e.g. bharuchbaps_annkut_new.

  DbSecretArn:
    Type: String
    Description: >
      ARN of a Secrets Manager secret holding {"username":"...","password":"..."}.
      Credentials are never placed in this template or in source - the PHP app
      hard-coded them in application/config/database.php and they must be
      rotated before this stack goes live.

  AppTimezone:
    Type: String
    Default: Asia/Kolkata
    Description: >
      Timezone used for every date() equivalent, which decides which row of
      sevak_targets / mandal_targets counts as "this year". Must match whatever
      the old cPanel host used or year-boundary writes will land on the wrong
      row.

  CorsAllowedOrigins:
    Type: String
    Default: https://master.d3lfyncl45ukvr.amplifyapp.com,http://localhost:3000
    Description: Comma-separated origins permitted to call the API.

  VpcSubnetIds:
    Type: CommaDelimitedList
    Description: >
      Private subnets that can reach RDS. Use at least two AZs. These must have
      a route to Secrets Manager - either a NAT gateway or a VPC endpoint.

  LambdaSecurityGroupId:
    Type: String
    Description: >
      Security group for the function. The RDS security group must allow
      inbound 3306 from this group.

Globals:
  Function:
    Runtime: nodejs22.x
    Architectures: [arm64]          # Graviton: cheaper per ms than x86.
    Timeout: 30                     # API Gateway caps the response at 29s.
    MemorySize: 512                 # CPU scales with memory; 512MB keeps
                                    # cold starts near a second for this app.
    Tracing: Active

Resources:
  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: !Ref Stage
      # CORS is handled inside Express so that the allowlist lives in one place
      # and preflight behaviour matches the PHP exactly.
      AccessLogSettings:
        DestinationArn: !GetAtt ApiAccessLogGroup.Arn
        Format: >-
          {"requestId":"$context.requestId","ip":"$context.identity.sourceIp",
          "method":"$context.httpMethod","path":"$context.path",
          "status":"$context.status","latency":"$context.responseLatency",
          "integrationError":"$context.integrationErrorMessage"}

  ApiAccessLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/apigateway/annkut-${Stage}'
      RetentionInDays: 30

  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'annkut-api-${Stage}'
      CodeUri: ./
      Handler: src/lambda.handler
      Description: Annkut JSON API (all CodeIgniter controllers).
      VpcConfig:
        SubnetIds: !Ref VpcSubnetIds
        SecurityGroupIds:
          - !Ref LambdaSecurityGroupId
      Environment:
        Variables:
          NODE_ENV: production
          NODE_OPTIONS: '--enable-source-maps'
          DB_HOST: !Ref DbHost
          DB_PORT: !Ref DbPort
          DB_NAME: !Ref DbName
          DB_SECRET_ARN: !Ref DbSecretArn
          DB_SSL: 'true'
          DB_POOL_SIZE: '2'
          APP_TIMEZONE: !Ref AppTimezone
          CORS_ALLOWED_ORIGINS: !Ref CorsAllowedOrigins
          EXPOSE_ERRORS: 'false'
      Policies:
        - AWSLambdaVPCAccessExecutionRole
        - Statement:
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource: !Ref DbSecretArn
      Events:
        # Catch-all: routing is Express's job, mirroring CI's front controller.
        AnyRoute:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /{proxy+}
            Method: ANY
        Root:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /
            Method: ANY

  FunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/annkut-api-${Stage}'
      RetentionInDays: 30

Outputs:
  ApiBaseUrl:
    Description: Base URL to point the Amplify frontend at.
    Value: !Sub 'https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com/${Stage}'

  FunctionName:
    Value: !Ref ApiFunction
